<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>0800 Creaciones - Ruleta de Premios</title>
  <style>
    :root {
      --primary-red: #E30613;
      --dark-bg: #0b0b0b;
      --card-bg: #141414;
      --text-white: #ffffff;
      --border-color: #222222;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--dark-bg);
      color: var(--text-white);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 25px 15px;
    }

    /* Imagen de Logo Real */
    .brand-logo-img {
      max-width: 240px;
      height: auto;
      margin-bottom: 15px;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.9));
      border-radius: 8px;
    }

    /* Encabezado */
    .header-text {
      text-align: center;
      margin-bottom: 15px;
    }

    .header-text h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .header-text p {
      color: #777777;
      font-size: 0.85rem;
    }

    .main-container {
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Ruleta Container */
    .wheel-container {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 10px 0 25px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid var(--primary-red);
      z-index: 10;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }

    canvas {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(227, 6, 19, 0.35);
    }

    /* Center Scissor Icon */
    .wheel-center-icon {
      position: absolute;
      width: 50px;
      height: 50px;
      background-color: #111111;
      border: 3px solid var(--primary-red);
      border-radius: 50%;
      z-index: 5;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--primary-red);
      font-size: 22px;
      box-shadow: 0 0 10px rgba(0,0,0,0.8);
    }

    /* Botón Girar */
    .btn-spin {
      background-color: var(--primary-red);
      color: white;
      border: none;
      padding: 14px 40px;
      font-size: 1.1rem;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      max-width: 280px;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(227, 6, 19, 0.4);
    }

    .btn-spin:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(227, 6, 19, 0.6);
    }

    .btn-spin:disabled {
      background-color: #2A2A2A;
      color: #666;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    /* Mensajes de Resultado y Bloqueo */
    .status-box {
      margin-top: 20px;
      padding: 12px 18px;
      border-radius: 20px;
      text-align: center;
      width: 100%;
      font-size: 0.85rem;
      font-weight: 600;
      display: none;
    }

    .status-ticket {
      background-color: rgba(46, 204, 113, 0.1);
      border: 1px solid rgba(46, 204, 113, 0.3);
      color: #2ecc71;
    }

    .status-error {
      background-color: rgba(231, 76, 60, 0.1);
      border: 1px solid rgba(231, 76, 60, 0.3);
      color: #e74c3c;
    }

    /* Panel Admin */
    .admin-panel {
      background-color: #141414;
      border: 1px dashed var(--primary-red);
      border-radius: 15px;
      padding: 15px;
      width: 100%;
      margin-top: 25px;
    }

    .admin-panel h3 {
      font-size: 0.9rem;
      color: var(--primary-red);
      margin-bottom: 8px;
    }

    .admin-input {
      width: 100%;
      padding: 10px;
      background: #222;
      border: 1px solid #333;
      color: white;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 0.8rem;
    }

    .btn-admin {
      background: #252525;
      color: white;
      border: 1px solid #444;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      width: 100%;
      font-weight: bold;
    }

    .btn-admin:hover {
      background: #333;
    }
  </style>
</head>
<body>

  <!-- AQUÍ CARGA TU LOGO DESDE EL REPOSITORIO -->
  <img src="logo.jpg" alt="0800 Creaciones" class="brand-logo-img">

  <!-- TITLE -->
  <div class="header-text">
    <h1>¡Girá y Ganá tu Premio!</h1>
    <p>Giro válido por una sola oportunidad</p>
  </div>

  <div class="main-container">
    <div class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheelCanvas" width="320" height="320"></canvas>
      <div class="wheel-center-icon">✂</div>
    </div>

    <button id="spinBtn" class="btn-spin" onclick="spinWheel()">
      <span>🔄</span> GIRAR RULETA
    </button>

    <div id="statusBox" class="status-box"></div>

    <!-- PANEL SOLO PARA EL DUEÑO (OCULTO A CLIENTES) -->
    <div id="adminPanel" class="admin-panel" style="display: none;">
      <h3>🔒 Panel de Control (Uso Interno)</h3>
      <p style="font-size: 0.8rem; color: #888; margin-bottom: 10px;">Generá el enlace único para enviarle al cliente por WhatsApp:</p>
      <input type="text" id="generatedUrl" class="admin-input" readonly placeholder="Hacé clic abajo para generar el enlace">
      <button class="btn-admin" onclick="generateClientToken()">✨ Generar y Copiar Link Único</button>
    </div>
  </div>

  <script>
    // Configuración de Premios Exactos
    const prizes = [
      { label: "5% de descuento", color: "#E30613", textColor: "#ffffff" },
      { label: "Gracias por tu compra,\nsuerte la próxima", color: "#1c1c1c", textColor: "#aaaaaa" },
      { label: "10% de descuento", color: "#111111", textColor: "#ffffff" },
      { label: "2x1 Vinilo\nGlobo Burbuja", color: "#1c1c1c", textColor: "#ffffff" },
      { label: "¡Otro tiro!", color: "#E30613", textColor: "#ffffff" }
    ];

    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    const spinBtn = document.getElementById("spinBtn");
    const statusBox = document.getElementById("statusBox");
    const adminPanel = document.getElementById("adminPanel");

    let currentAngle = 0;
    let isSpinning = false;

    // Detectar cliente o dueño por URL
    const urlParams = new URLSearchParams(window.location.search);
    const clientToken = urlParams.get("token");
    const isAdmin = !clientToken;

    if (isAdmin) {
      adminPanel.style.display = "block";
    } else {
      showStatus(`● Ticket Activo: #${clientToken}`, "ticket");
    }

    if (clientToken) {
      const usedTokens = JSON.parse(localStorage.getItem("usedTokens") || "[]");
      if (usedTokens.includes(clientToken)) {
        showStatus("⚠️ Este enlace ya fue utilizado y tu premio quedó registrado. ¡Gracias por tu compra!", "error");
        spinBtn.disabled = true;
      }
    }

    // --- SONIDOS NATIVOS ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTickSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }

    function playWinSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const notes = [261.63, 329.63, 392.00, 523.25];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime + idx * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.1 + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.1);
        osc.stop(audioCtx.currentTime + idx * 0.1 + 0.3);
      });
    }

    // Dibujar Ruleta Centrada
    function drawWheel() {
      const numSegments = prizes.length;
      const arcSize = (2 * Math.PI) / numSegments;
      ctx.clearRect(0, 0, 320, 320);

      for (let i = 0; i < numSegments; i++) {
        const angle = currentAngle + i * arcSize;
        ctx.beginPath();
        ctx.fillStyle = prizes[i].color;
        ctx.moveTo(160, 160);
        ctx.arc(160, 160, 155, angle, angle + arcSize);
        ctx.lineTo(160, 160);
        ctx.fill();
        ctx.strokeStyle = "#2b2b2b";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.translate(160, 160);
        ctx.rotate(angle + arcSize / 2);
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = prizes[i].textColor;
        ctx.font = "bold 11px sans-serif";

        const lines = prizes[i].label.split("\n");
        const lineHeight = 13;
        const startY = -((lines.length - 1) * lineHeight) / 2;

        lines.forEach((line, lineIdx) => {
          ctx.fillText(line, 130, startY + (lineIdx * lineHeight));
        });
        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(160, 160, 157, 0, Math.PI * 2);
      ctx.strokeStyle = "#E30613";
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    // Animación de giro
    function spinWheel() {
      if (isSpinning) return;

      if (clientToken) {
        const usedTokens = JSON.parse(localStorage.getItem("usedTokens") || "[]");
        if (usedTokens.includes(clientToken)) {
          showStatus("⚠️ Este enlace ya fue utilizado.", "error");
          spinBtn.disabled = true;
          return;
        }
      }

      isSpinning = true;
      spinBtn.disabled = true;

      const selectedIndex = Math.floor(Math.random() * prizes.length);
      const segmentArc = (2 * Math.PI) / prizes.length;
      const targetAngle = (3 * Math.PI / 2) - (selectedIndex * segmentArc) - (segmentArc / 2);
      const totalRotation = (Math.PI * 2 * 6) + targetAngle;

      let start = null;
      const duration = 4500;
      let lastSegmentIndex = -1;

      function animate(timestamp) {
        if (!start) start = timestamp;
        const elapsed = timestamp - start;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);

        currentAngle = easeOut * totalRotation;
        drawWheel();

        const currentSegment = Math.floor((currentAngle % (Math.PI * 2)) / segmentArc);
        if (currentSegment !== lastSegmentIndex) {
          playTickSound();
          lastSegmentIndex = currentSegment;
        }

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          const prize = prizes[selectedIndex].label.replace("\n", " ");
          playWinSound();

          if (prize.includes("Otro tiro")) {
            showStatus("🎯 ¡OTRO TIRO! La ruleta vuelve a girar automáticamente...", "ticket");
            setTimeout(() => {
              spinWheel();
            }, 1800);
          } else {
            if (prize.includes("Gracias")) {
              showStatus(`💬 ${prize}`, "ticket");
            } else {
              showStatus(`🎉 ¡FELICITACIONES! Ganaste: ${prize}`, "ticket");
            }

            if (clientToken) {
              const usedTokens = JSON.parse(localStorage.getItem("usedTokens") || "[]");
              usedTokens.push(clientToken);
              localStorage.setItem("usedTokens", JSON.stringify(usedTokens));
            }
          }
        }
      }

      requestAnimationFrame(animate);
    }

    function showStatus(msg, type) {
      statusBox.style.display = "block";
      statusBox.className = `status-box status-${type}`;
      statusBox.innerText = msg;
    }

    function generateClientToken() {
      const newToken = '0800-' + Math.random().toString(36).substr(2, 8).toUpperCase();
      const baseUrl = window.location.origin + window.location.pathname;
      const fullUrl = `${baseUrl}?token=${newToken}`;
      
      const input = document.getElementById("generatedUrl");
      input.value = fullUrl;
      
      navigator.clipboard.writeText(fullUrl).then(() => {
        alert("¡Enlace único copiado exitosamente! Ya podés pegarlo en WhatsApp para enviárselo a tu cliente.");
      }).catch(() => {
        alert("Enlace generado. Copialo directamente del casillero.");
      });
    }

    drawWheel();
  </script>
</body>
</html>
